<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKTBTNA</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">

<style>
:root{
--primary:#3F2A1B; /* بني أغمق أقوى */
--bg:#F2E6D8;
--dark:#111;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,body{
width:100%;
overflow-x:hidden;
font-family:'Cairo',sans-serif;
background:var(--bg);
color:#222;
}

/* NAV */
nav{
position:fixed;
top:0;
left:0;
right:0;
width:100%;
background:white;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 5px 20px rgba(0,0,0,.05);
z-index:1000;
}

.logo{
font-weight:800;
font-size:18px;
}

.nav-btn{
background:var(--primary);
color:white;
border:none;
padding:10px 25px;
border-radius:30px;
cursor:pointer;
transition:.3s;
}

.nav-btn:hover{
transform:scale(1.1);
}

/* SECTION */
.section{
width:100%;
padding:120px 20px;
text-align:center;
opacity:0;
transform:translateY(60px);
transition:1s ease;
}

.section.show{
opacity:1;
transform:translateY(0);
}

/* HERO */
.hero{
padding-top:160px;
}

.hero h1{
font-size:30px;
margin-bottom:15px;
}

.hero p{
font-size:18px;
color:#555;
margin-bottom:30px;
}

.hero button{
background:var(--primary);
color:white;
padding:15px 45px;
border:none;
border-radius:35px;
cursor:pointer;
transition:.3s;
}

.hero button:hover{
transform:translateY(-5px);
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

/* FULL IMAGE */
.full-img{
width:100vw;
height:auto;
display:block;
margin:40px 0;
transition:.5s ease;
}

.full-img:hover{
transform:scale(1.05);
}

/* STATS */
.stats{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
margin-top:40px;
}

.stat{
background:white;
padding:30px;
border-radius:20px;
width:220px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
transition:.3s;
}

.stat:hover{
transform:translateY(-8px);
}

.stat h2{
color:var(--primary);
font-size:26px;
}

/* FEATURES */
.feature{
background:white;
padding:20px;
border-radius:15px;
margin:15px auto;
max-width:800px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
transition:.3s;
cursor:pointer;
}

.feature:hover{
transform:translateX(-10px);
}

/* FOOTER */
footer{
width:100%;
background:#111;
color:white;
text-align:center;
padding:30px 0;
}

/* RESPONSIVE */
@media(max-width:768px){
.stat{width:100%}
}
</style>
</head>

<body>

<nav>
<div class="logo">MKTBTNA</div>
<button class="nav-btn" onclick="goBuy()">اشترك الآن</button>
</nav>

<section class="section hero">
<h1>منصة تعليمية احترافية لتنمية مهارات طفلك</h1>
<p>تعلم آمن – محتوى تفاعلي – تشغيل بدون إنترنت</p>
<button onclick="goBuy()">ابدأ الآن</button>

<div class="stats">
<div class="stat">
<h2 id="clients">0</h2>
<p>ولي أمر يثق بنا</p>
</div>
<div class="stat">
<h2 id="videos">0</h2>
<p>فيديو تعليمي</p>
</div>
<div class="stat">
<h2 id="hours">0</h2>
<p>ساعة محتوى</p>
</div>
</div>
</section>

<section class="section">
<img src="img1.jpg" class="full-img">
<img src="img2.jpg" class="full-img">
<img src="img3.jpg" class="full-img">
</section>

<section class="section">
<div class="feature">تعلم القراءة والكتابة بأسلوب مبسط</div>
<div class="feature">فيديوهات حركة وتنشيط ذهني</div>
<div class="feature">قصص تربوية هادفة</div>
<div class="feature">تشغيل بدون إنترنت بعد التحميل</div>
</section>

<footer>
© 2026 MKTBTNA - جميع الحقوق محفوظة
</footer>

<script>
function goBuy(){
window.location.href="checkout.html";
}

/* Reveal Animation */
window.addEventListener("scroll",()=>{
document.querySelectorAll(".section").forEach(sec=>{
if(sec.getBoundingClientRect().top<window.innerHeight-100){
sec.classList.add("show");
}
});
});

/* Counter */
function animateCounter(id,target){
let el=document.getElementById(id);
let count=0;
let interval=setInterval(()=>{
count+=Math.ceil(target/100);
if(count>=target){
count=target;
clearInterval(interval);
}
el.innerText=count.toLocaleString();
},20);
}

animateCounter("clients",6320);
animateCounter("videos",205);
animateCounter("hours",480);
</script>

</body>
</html>
