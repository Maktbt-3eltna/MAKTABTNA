<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إتمام الطلب - MKTBTNA</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Cairo',sans-serif;
background:linear-gradient(180deg,#F4EDE4,#EFE4D4);
color:#222;
}

.section{
max-width:900px;
margin:auto;
padding:100px 20px;
}

.package{
background:white;
padding:35px;
border-radius:30px;
margin-bottom:25px;
box-shadow:0 20px 60px rgba(0,0,0,.1);
cursor:pointer;
transition:.3s;
}

.package:hover{
transform:translateY(-6px);
}

.package.selected{
border:3px solid #C8A96A;
}

.price{
font-size:26px;
font-weight:800;
color:#A8894F;
}

.copy-btn{
background:#A8894F;
color:white;
border:none;
padding:15px 30px;
border-radius:20px;
cursor:pointer;
margin-top:15px;
}

.btn{
background:#C8A96A;
color:white;
padding:20px 50px;
border:none;
border-radius:40px;
font-size:18px;
cursor:pointer;
margin-top:30px;
}

footer{
background:#111;
color:white;
text-align:center;
padding:30px;
margin-top:100px;
}
</style>
</head>

<body>

<section class="section">

<h2>اختر الباقة</h2>

<div class="package" onclick="selectPackage(this,'81 فيديو - 99 جنيه')">
81 فيديو
<div class="price">99 جنيه</div>
</div>

<div class="package" onclick="selectPackage(this,'126 فيديو - 149 جنيه')">
126 فيديو
<div class="price">149 جنيه</div>
</div>

<div class="package" onclick="selectPackage(this,'205 فيديو - 199 جنيه')">
205 فيديو
<div class="price">199 جنيه</div>
</div>

<p id="selectedText" style="font-weight:700;color:#A8894F;"></p>

<h3>التحويل على الرقم:</h3>
<h2>01112422946</h2>

<button class="copy-btn" onclick="copyNumber()">نسخ الرقم</button>

<button class="btn" onclick="finishOrder()">
أرسلت التحويل
</button>

</section>

<footer>
© 2026 MKTBTNA - جميع حقوق النشر محفوظة
</footer>

<script>
let selectedPackage="";

function selectPackage(el,text){
document.querySelectorAll(".package").forEach(p=>p.classList.remove("selected"));
el.classList.add("selected");
selectedPackage=text;
document.getElementById("selectedText").innerText="تم اختيار: "+text;
}

function copyNumber(){
navigator.clipboard.writeText("01112422946");
alert("تم نسخ الرقم بنجاح");
}

function finishOrder(){
if(selectedPackage===""){
alert("يرجى اختيار باقة أولاً");
return;
}
window.location.href="https://www.facebook.com/share/19QUCzV7qG/";
}
</script>

</body>
</html>
